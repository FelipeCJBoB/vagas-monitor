# ============================================================
#  Taxonomia de habilidades procuradas nas descrições das vagas.
#
#  Cada entrada vira uma linha do mapa "presencial x remoto" do relatório.
#  `termos` são buscados na descrição com fronteira de palavra e sem acento,
#  então "power bi" casa com "Power BI" mas "bi" não casa dentro de "ambiente".
#
#  `tenho` declara o que já está no currículo (perfil.md). É isso que separa
#  "o mercado pede" de "você precisa estudar" — sem essa marcação o relatório
#  só repetiria que SQL é popular, o que não ajuda a decidir nada.
#    sim     = domina, não é prioridade de estudo
#    parcial = usou em projeto pessoal, falta profundidade ou uso profissional
#    nao     = lacuna real
# ============================================================

habilidades:
  # --- linguagens e fundamentos ------------------------------------------
  python:       {nome: Python,            grupo: Linguagem,  tenho: sim,     termos: [python, pandas, numpy]}
  sql:          {nome: SQL,               grupo: Dados,      tenho: sim,     termos: [sql, "t-sql", "pl/sql", ansi sql, consultas sql]}
  javascript:   {nome: JavaScript/TS,     grupo: Linguagem,  tenho: parcial, termos: [javascript, typescript, node, nodejs, "node.js"]}
  java:         {nome: Java,              grupo: Linguagem,  tenho: nao,     termos: [java, spring, spring boot, jpa, hibernate]}
  csharp:       {nome: C#/.NET,           grupo: Linguagem,  tenho: nao,     termos: ["c#", ".net", dotnet, asp.net]}
  php:          {nome: PHP,               grupo: Linguagem,  tenho: nao,     termos: [php, laravel, symfony]}
  r_lang:       {nome: R,                 grupo: Dados,      tenho: nao,     termos: [linguagem r, rstudio]}

