# ============================================================
#  Tecnologias procuradas nas descrições das vagas.
#
#  Cada entrada é UMA tecnologia, com o nome que aparece no anúncio: "React",
#  "PostgreSQL", "RAG". Nunca a família ("Front-end", "Banco de dados"). O
#  relatório conta em quantas vagas cada uma aparece e ranqueia pela contagem.
#
#  `termos` são só grafias da MESMA coisa ("node.js", "nodejs"). Não coloque
#  aqui uma tecnologia vizinha: "pandas" não conta como Python, "pgvector" não
#  conta como banco vetorial. Cada uma é contada em separado, literalmente.
#
#  A busca é sem acento e com fronteira de palavra: "sap" não casa dentro de
#  "sapataria", "java" não casa dentro de "javascript". Termo ambíguo em
#  português ou inglês corrente ("make", "rest", "go", "express") só entra na
#  forma que não deixa dúvida ("make.com", "api rest", "golang", "express.js").
#
#  Termo com "=" na frente é buscado respeitando MAIÚSCULAS: "=React" casa com
#  "React" mas não com "react quickly" de um anúncio em inglês; "=SOLID" não
#  casa com "solid experience"; "=Excel" não casa com "excel at".
#
#  `grupo` só organiza o arquivo e aparece como rótulo discreto no painel.
# ============================================================

