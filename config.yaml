fontes:
  linkedin:
    ativo: true
    cidades_ancora: [Itajaí, Blumenau, Joinville]   # a busca do LinkedIn cobre ~40 km ao redor
    paginas: 2                                       # 10 vagas por página
    buscar_descricao: true                           # 1 requisição por vaga do LinkedIn no escopo (o card não traz descrição)
    max_descricoes: 80
  indeed:
    ativo: true
    resultados_por_busca: 40
  gupy:
    ativo: true

relatorio:
  pasta: reports
  html: docs/index.html
  top_n: 20                  # destaques no topo do relatório
  url_publica: https://felipecjbob.github.io/vagas-monitor/   # link "Relatório completo" no Telegram/e-mail

notificacoes:
  telegram:
    ativo: auto              # auto = envia se TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID existirem
    top_n: 15
  email:
    ativo: auto              # auto = envia se SMTP_USER / SMTP_PASSWORD / EMAIL_TO existirem

# ------------------------------------------------------------------
#  Avaliação por IA (opcional): nota de 0 a 10 e comentário por vaga.
#
#  `provedor: auto` usa o primeiro com chave configurada, na ordem
#  Gemini -> Anthropic. O Gemini vem primeiro porque o nível gratuito
#  do AI Studio cobre este volume (25 vagas a cada 5 dias) sem custo,
#  enquanto a API da Anthropic é pré-paga.
#
#  Valores: auto | gemini | anthropic | nenhum
# ------------------------------------------------------------------
avaliacao:
  provedor: auto
  max_vagas: 25              # avalia só as N melhores vagas novas da rodada
  gemini:
    # Alias que o Google mantém apontando para o Flash atual. Fixar uma versão
    # ("gemini-3.6-flash") evita surpresa de comportamento, mas quebra sozinho
    # quando aquela versão sai do ar.
    modelo: gemini-flash-latest
    rpm: 10                  # nível gratuito do Flash; as chamadas são espaçadas
  anthropic:
    modelo: claude-opus-5
    esforco: low
